
name: PR Checklist Comment

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add checklist comment to new PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const body = [
              "👋 Thanks for opening this PR.",
              "",
              "Please reply in this PR description or comments with:",
              "",
              "- ✅ **What changed** (short summary)",
              "- ✅ **How you tested** (basic steps)",
              "- ✅ **Any blocker / known issue**",
              "",
              "Before requesting merge, please make sure your branch is updated with the latest `develop`."
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body
            });
