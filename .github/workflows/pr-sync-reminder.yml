name: PR Sync Reminder

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Remind to sync with develop
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Optional: only remind when target branch is develop
            if (pr.base.ref !== "develop") {
              core.info(`Base branch is ${pr.base.ref}, skipping develop sync reminder.`);
              return;
            }

            const body = [
              "🔄 **Sync Reminder**",
              "",
              "Please sync your branch with the latest `develop` before final review/merge.",
              "",
              "Suggested commands:",
              "```bash",
              "git checkout " + pr.head.ref,
              "git fetch origin",
              "git merge origin/develop",
              "# resolve conflicts (if any)",
              "git add .",
              "git commit -m \"resolve conflicts with develop\"",
              "git push",
              "```"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body
            });
